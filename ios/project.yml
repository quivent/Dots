name: Dots
options:
  bundleIdPrefix: com.quivent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Dots:
    type: application
    platform: iOS
    sources:
      - path: Dots
      - path: ../shared/BluetoothWire.swift
    info:
      path: Dots/Info.plist
      properties:
        CFBundleDisplayName: Dots
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [chatgpt]
        NSLocalNetworkUsageDescription: Connect to your optional Dots daemon on your Mac.
        NSBluetoothAlwaysUsageDescription: Connect through your nearby Mac or invite a nearby phone to your Dots server.
        NSBonjourServices: [_dots._tcp]
        UIBackgroundModes: [bluetooth-central]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quivent.dots
        DEVELOPMENT_TEAM: 5FV777CV9K
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  DotsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DotsTests]
    dependencies:
      - target: Dots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DotsUITests]
    dependencies:
      - target: Dots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dots:
    build:
      targets:
        Dots: all
    test:
      targets: [DotsTests, DotsUITests]
